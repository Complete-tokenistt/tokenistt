# tokenistt — Real-time Analytics Pipeline (Prompt 6)
# ClickHouse (OLAP store + pre-aggregation) + Kafka (stream ingest) + consumer.
#
#   docker compose up --build
#   # then, in another shell, generate synthetic load:
#   docker compose exec consumer npm run producer
services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: tokenistt-clickhouse
    ports:
      - "8123:8123" # HTTP interface (used by the consumer + dashboards)
      - "9000:9000" # native protocol
    environment:
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - ./clickhouse/init:/docker-entrypoint-initdb.d:ro
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [analytics]

  kafka:
    image: bitnami/kafka:3.7
    container_name: tokenistt-kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_KRAFT_MODE=yes
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CREATE_TOPICS=transactions:3:1 # topic:partitions:replicas
      - ALLOW_PLAINTEXT_LISTENER=yes
    volumes:
      - kafka_data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
    networks: [analytics]

  consumer:
    build: ./consumer
    container_name: tokenistt-consumer
    depends_on:
      clickhouse:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: transactions
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DATABASE: default
      BATCH_SIZE: "5000"
      FLUSH_MS: "2000"
      ANOMALY_INTERVAL_MS: "300000" # re-run anomaly detection every 5 min
    networks: [analytics]

  grafana:
    image: grafana/grafana:11.1.0
    container_name: tokenistt-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: grafana-clickhouse-datasource
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - grafana_data:/var/lib/grafana
    depends_on:
      clickhouse:
        condition: service_healthy
    networks: [analytics]

networks:
  analytics:
    driver: bridge

volumes:
  clickhouse_data:
  kafka_data:
  grafana_data:
