[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenistt"
version = "0.1.0"
description = "Drop-in Python replacement for the openai library that routes to the Tokenistt gateway, with auto-retry, cost tracking, budget warnings, and per-user attribution."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
authors = [{ name = "Tokenistt" }]
keywords = ["openai", "llm", "gateway", "cost-tracking", "budget", "tokenistt", "ai"]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["tokenistt*"]
