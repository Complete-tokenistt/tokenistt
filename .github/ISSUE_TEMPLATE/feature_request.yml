name: Feature request
description: Suggest a new capability or an improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Please check [docs/ROADMAP.md](https://github.com/Complete-tokenistt/tokenist-main/blob/main/docs/ROADMAP.md) first. Proposals that add new
        infrastructure (a new database, queue or external service) should start here as an issue,
        not as a PR.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I'm willing to open a PR for this
