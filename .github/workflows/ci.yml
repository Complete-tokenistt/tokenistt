name: CI
on:
  pull_request:
  workflow_call: # main is tested by release.yml, which calls this before publishing anything

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: ci, POSTGRES_DB: tokenistt, POSTGRES_USER: tokenistt }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tokenistt" --health-interval 5s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgres://tokenistt:ci@localhost:5432/tokenistt
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run migrate -w packages/db
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -e packages/sdk-python
      - run: python packages/sdk-python/tests/smoke.py
      - run: npm run test:e2e -w apps/gateway

  cli:
    # node:sqlite needs Node 22.13+; build-test stays on Node 20 for the gateway and skips these tests.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck -w cli
      - run: npm run build -w cli
      - run: npm test -w cli

  cli-e2e:
    # The real CLI against a real gateway, Postgres and Redis (mock provider, no network).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: ci, POSTGRES_DB: tokenistt, POSTGRES_USER: tokenistt }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tokenistt" --health-interval 5s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgres://tokenistt:ci@localhost:5432/tokenistt
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run migrate -w packages/db
      - run: npm run test:e2e -w cli

  python-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.9', '3.12']
    defaults:
      run:
        working-directory: packages/sdk-python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '${{ matrix.python }}' }
      - run: pip install -e .
      - run: python tests/smoke.py

  docker-build:
    # Builds every image without pushing, so a broken Dockerfile fails the PR, not the release.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: [gateway, dashboard, migrate]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/${{ matrix.image }}.Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
