name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: ci, POSTGRES_DB: tokenistt, POSTGRES_USER: tokenistt }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tokenistt" --health-interval 5s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgres://tokenistt:ci@localhost:5432/tokenistt
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run migrate -w packages/db
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
