name: Release SDKs
# Push a tag like `sdk-v0.1.0` to publish both SDKs. Requires repository secrets NPM_TOKEN and PYPI_API_TOKEN.
on:
  push:
    tags: ['sdk-v*']
jobs:
  npm:
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, registry-url: 'https://registry.npmjs.org' }
      - run: npm ci
      - run: npm run build -w packages/sdk-ts
      - run: npm test -w packages/sdk-ts
      - run: npm publish -w packages/sdk-ts --provenance --access public
        env: { NODE_AUTH_TOKEN: '${{ secrets.NPM_TOKEN }}' }
  pypi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install build twine -e packages/sdk-python
      - run: python packages/sdk-python/tests/smoke.py
      - run: python -m build packages/sdk-python
      - run: twine upload packages/sdk-python/dist/*
        env: { TWINE_USERNAME: __token__, TWINE_PASSWORD: '${{ secrets.PYPI_API_TOKEN }}' }
