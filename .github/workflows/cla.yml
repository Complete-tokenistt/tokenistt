name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write # stores signatures on the cla-signatures branch
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    # Bot PRs are skipped: Dependabot runs get a read-only token, so the action can't
    # comment or set status, and bots don't sign CLAs anyway. Skipped counts as passing.
    if: >-
      !endsWith(github.event.pull_request.user.login, '[bot]') &&
      ((github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') ||
       github.event_name == 'pull_request_target')
    steps:
      # Never checks out PR code, so pull_request_target is safe here.
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/${{ github.repository }}/blob/main/CLA.md
          path-to-signatures: signatures/version1/cla.json
          branch: cla-signatures
          allowlist: Aryan-theccool,A-kki,adityatiwari12,dependabot[bot],github-actions[bot]
