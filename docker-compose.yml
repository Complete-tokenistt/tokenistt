version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: tokenistt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tokenistt
      POSTGRES_USER: tokenistt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — set a strong value in .env or CI/CD secrets}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./tokenistt-sdk/db/drizzle/0000_init.sql:/docker-entrypoint-initdb.d/01_init.sql
      - ./tokenistt-sdk/db/drizzle/views.sql:/docker-entrypoint-initdb.d/02_views.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tokenistt -d tokenistt"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tokenistt-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  gateway:
    build:
      context: .
      dockerfile: tokenistt-gateway/universal-gateway/Dockerfile
    container_name: tokenistt-gateway
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: postgres://tokenistt:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in production}@postgres:5432/tokenistt
      REDIS_URL: redis://redis:6379
      DEFAULT_PROVIDER: anthropic
      # ── Required production secrets (must be set in .env or CI/CD secrets) ──
      # ADMIN_SECRET: used by validateSecrets() to guard /v1/admin/* endpoints
      ADMIN_SECRET: ${ADMIN_SECRET:?ADMIN_SECRET is required in production}
      # ENCRYPTION_KEY: AES-256-GCM key for BYOK provider key encryption (min 32 chars)
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required in production}
      # MASTER_KEY: AES-256-GCM key for BYOK API key encryption in vault.ts (min 32 chars)
      MASTER_KEY: ${MASTER_KEY:?MASTER_KEY is required in production}
      # ── Optional provider keys ────────────────────────────────────────────
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  dashboard:
    build:
      context: ./tokenistt-sdk/home/user/dashboard
      dockerfile: Dockerfile
    container_name: tokenistt-dashboard
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://tokenistt:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in production}@postgres:5432/tokenistt
      TOKENISTT_BASE_URL: http://gateway:3000/v1
      # ── Required production secrets ────────────────────────────────────────
      # JWT_SECRET: used by lib/auth.ts and middleware.ts for JWT signing/verification (min 32 chars)
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required in production}
      # STRICT_AUTH: enforces JWT authentication on all routes regardless of NODE_ENV
      STRICT_AUTH: "true"
    depends_on:
      postgres:
        condition: service_healthy
      gateway:
        condition: service_started

volumes:
  pgdata:

