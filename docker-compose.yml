# Tokenistt — self-hosted stack.
#
#   node scripts/setup.mjs    # writes .env with fresh secrets (or: cp .env.example .env and fill them in)
#   docker compose up --build -d
#
# Gateway  http://localhost:${GATEWAY_PORT:-3000}      Dashboard  http://localhost:${DASHBOARD_PORT:-3001}
#
# Network: Gateway and Dashboard bind to BIND_ADDR (default 127.0.0.1, this machine only). To serve
# other machines, put a TLS reverse proxy in front (see docs/DEPLOYMENT.md) or set BIND_ADDR=0.0.0.0
# and AUTH_MODE=jwt. Postgres and Redis are never published to the host; use
# `docker compose exec postgres psql -U tokenistt` to reach the database.

services:
  postgres:
    image: postgres:16-alpine
    container_name: tokenistt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tokenistt
      POSTGRES_USER: tokenistt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — set a strong value in .env or CI/CD secrets}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tokenistt -d tokenistt"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: tokenistt-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required — run node scripts/setup.mjs or set a strong value in .env}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Applies packages/db/drizzle/*.sql (tracked in schema_migrations) and exits.
  migrate:
    build:
      context: .
      dockerfile: infra/docker/migrate.Dockerfile
    container_name: tokenistt-migrate
    environment:
      DATABASE_URL: postgres://tokenistt:${POSTGRES_PASSWORD}@postgres:5432/tokenistt
      AUTH_MODE: ${AUTH_MODE:-jwt}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Optional: `docker compose --profile demo up seed` loads synthetic sample data into the local org.
  seed:
    profiles: ["demo"]
    build:
      context: .
      dockerfile: infra/docker/migrate.Dockerfile
    container_name: tokenistt-seed
    command: ["node", "seed-demo.mjs"]
    environment:
      DATABASE_URL: postgres://tokenistt:${POSTGRES_PASSWORD}@postgres:5432/tokenistt
      SEED_ORG_ID: "1"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  gateway:
    build:
      context: .
      dockerfile: infra/docker/gateway.Dockerfile
    container_name: tokenistt-gateway
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${GATEWAY_PORT:-3000}:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: postgres://tokenistt:${POSTGRES_PASSWORD}@postgres:5432/tokenistt
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      # Redis holds shared rate-limit / budget-reservation state; refuse to run without it.
      REDIS_REQUIRED: "true"
      DEFAULT_PROVIDER: ${DEFAULT_PROVIDER:-openai}
      # ── Required production secrets (must be set in .env or CI/CD secrets) ──
      # ADMIN_SECRET: operator access to /v1/admin/*
      ADMIN_SECRET: ${ADMIN_SECRET:?ADMIN_SECRET is required in production}
      # ENCRYPTION_KEY: AES-256-GCM key for BYOK provider key encryption (min 32 chars)
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required in production}
      # MASTER_KEY: AES-256-GCM key for BYOK API key encryption in vault.ts (min 32 chars)
      MASTER_KEY: ${MASTER_KEY:?MASTER_KEY is required in production}
      # JWT_SECRET: lets dashboard session tokens call the management API (min 32 chars)
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required in production}
      # ── Optional ───────────────────────────────────────────────────────────
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3001}
      # MOCK_PROVIDER=1 adds an offline fake provider (model prefix "mock:") for trying things without real keys
      MOCK_PROVIDER: ${MOCK_PROVIDER:-}
      # Bearer token for /metrics. Required: the Docker bridge counts as a private network, so
      # without it /metrics (spend by provider/model) would be readable from any published port.
      METRICS_TOKEN: ${METRICS_TOKEN:?METRICS_TOKEN is required — run node scripts/setup.mjs or set a strong value in .env}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      TOGETHER_API_KEY: ${TOGETHER_API_KEY:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      # Paths inside the container that map to the persistent volume
      TX_QUEUE_FILE: /app/gateway_data/tx_queue.jsonl
      AUDIT_QUEUE_FILE: /app/gateway_data/audit_queue.jsonl
    volumes:
      # Mount the durable queues on a named volume; otherwise anything queued while the DB
      # is down is lost on container restart.
      - gateway_tx_queue:/app/gateway_data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  dashboard:
    build:
      context: .
      dockerfile: infra/docker/dashboard.Dockerfile
    container_name: tokenistt-dashboard
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${DASHBOARD_PORT:-3001}:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://tokenistt:${POSTGRES_PASSWORD}@postgres:5432/tokenistt
      GATEWAY_URL: http://gateway:3000
      TOKENISTT_BASE_URL: http://gateway:3000/v1
      # What developers' tools should call from outside Docker (shown in the dashboard's setup snippets)
      PUBLIC_GATEWAY_URL: ${PUBLIC_GATEWAY_URL:-http://localhost:${GATEWAY_PORT:-3000}}
      # JWT_SECRET: signs/verifies dashboard sessions (min 32 chars); must equal the gateway's
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required in production}
      # MASTER_KEY: encrypts BYOK provider keys saved from Settings; must equal the gateway's
      MASTER_KEY: ${MASTER_KEY:?MASTER_KEY is required in production}
      # AUTH_MODE=jwt (default): sign-in required. The first visit offers owner setup (needs ADMIN_SECRET).
      # AUTH_MODE=open: no login, everyone is the owner. Only for a throwaway install on your own
      # machine; never combine it with BIND_ADDR=0.0.0.0.
      AUTH_MODE: ${AUTH_MODE:-jwt}
      # Set COOKIE_SECURE=false only if you serve the dashboard over plain HTTP on a trusted network.
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      OPEN_ORG_ID: "1"
      # Lets the dashboard call the gateway management API on behalf of signed-in users, and is the
      # one-time token for first-run owner setup
      ADMIN_SECRET: ${ADMIN_SECRET}
      # STRICT_AUTH: enforces JWT authentication on all routes regardless of NODE_ENV (unless AUTH_MODE=open)
      STRICT_AUTH: "true"
    depends_on:
      postgres:
        condition: service_healthy
      gateway:
        condition: service_started

volumes:
  pgdata:
  redisdata:
  gateway_tx_queue:   # Persistent storage for the durable transaction + audit queues
